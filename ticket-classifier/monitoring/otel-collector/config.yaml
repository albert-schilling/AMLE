# OTel Collector: receives OTLP from the app, sends metrics to Prometheus,
# traces to Tempo and logs to Loki.
# Docs: https://opentelemetry.io/docs/collector/configuration/

receivers:
  otlp:
    protocols:
      # The collector listens on localhost by default; 0.0.0.0 lets the Docker port
      # mapping reach it. The host side is bound to 127.0.0.1 in docker-compose.yml.
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # First in every pipeline: refuses data before the collector runs out of memory.
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  # Last before the exporters: sends data in batches.
  batch: {}

exporters:
  # Prometheus takes OTLP over HTTP only. `endpoint` is a base URL: the exporter
  # sends to <endpoint>/v1/metrics, i.e. /api/v1/otlp/v1/metrics.
  otlp_http/prometheus:
    endpoint: http://prometheus:9090/api/v1/otlp
  # Tempo takes OTLP gRPC; plaintext inside the Docker network.
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  # Loki 3 takes OTLP natively. `endpoint` is a base URL: the exporter sends to
  # <endpoint>/v1/logs, i.e. /otlp/v1/logs.
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
  # Prints a short summary of what passes through: `docker compose logs otel-collector`.
  debug:
    verbosity: basic

connectors:
  # The Anthropic SDK writes tokens and cost on its spans but records no metrics, so
  # they are derived here. Output is delta: Prometheus stores it as is (see
  # otlp-native-delta-ingestion), so query it with sum_over_time, not increase.
  # Without service.instance.id, all runs add up in the same series.
  # Docs: https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/main/connector/signaltometricsconnector
  signal_to_metrics:
    spans:
      - name: llm.calls
        description: Model calls
        conditions:
          - span.attributes["gen_ai.usage.input_tokens"] != nil
        include_resource_attributes: &llm_resource
          - key: service.name
          - key: service.namespace
          - key: service.version
          - key: deployment.environment.name
        attributes: &llm_attributes
          - key: gen_ai.request.model
        sum:
          value: Int(AdjustedCount())
          monotonic: true
      - name: llm.input.tokens
        description: Input tokens
        conditions:
          - span.attributes["gen_ai.usage.input_tokens"] != nil
        include_resource_attributes: *llm_resource
        attributes: *llm_attributes
        sum:
          value: Int(span.attributes["gen_ai.usage.input_tokens"])
          monotonic: true
      - name: llm.output.tokens
        description: Output tokens
        conditions:
          - span.attributes["gen_ai.usage.output_tokens"] != nil
        include_resource_attributes: *llm_resource
        attributes: *llm_attributes
        sum:
          value: Int(span.attributes["gen_ai.usage.output_tokens"])
          monotonic: true
      - name: llm.cost.usd
        description: Estimated cost in USD
        conditions:
          - span.attributes["gen_ai.usage.cost.total"] != nil
        include_resource_attributes: *llm_resource
        attributes: *llm_attributes
        sum:
          value: Double(span.attributes["gen_ai.usage.cost.total"])
          monotonic: true
      # Ticket runs that did work; a run that only read a saved result is not counted.
      - name: tickets.runs
        description: Ticket runs by outcome
        conditions:
          - 'IsMatch(span.name, "^ticket\\.(run|resume)$") and span.attributes["ticket.reused"] == nil'
        include_resource_attributes: *llm_resource
        attributes:
          - key: run_mode
          - key: ticket.status
            default_value: unknown
          - key: category
            default_value: unknown
          - key: priority
            default_value: unknown
        sum:
          value: Int(AdjustedCount())
          monotonic: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/prometheus, debug]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_grpc/tempo, signal_to_metrics, debug]
    metrics/from_spans:
      receivers: [signal_to_metrics]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/prometheus, debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/loki, debug]
