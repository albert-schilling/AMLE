[project]
name = "ticket-classifier"
version = "0.1.0"
description = "Classifies tickets with the help of AI."
readme = "README.md"
authors = [
    { name = "Albert Schilling", email = "albertschilling@gmx.net" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=2.6.0",
    "fastembed>=0.9,<0.10",
    "genai-otel-instrument[anthropic,langgraph]>=1.48.1",
    "langchain-core>=1.8,<2",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "numpy>=1.26,<3",
    "opentelemetry-instrumentation-logging>=0.66b2",
    "pgvector>=0.5,<0.6",
    "psycopg[binary]>=3.3,<4",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
]

[project.scripts]
ticket-classifier = "ticket_classifier.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-mock>=3.17.0",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "postgres: needs the test database, run with make test-db",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
