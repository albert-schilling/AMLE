[project]
name = "scoutbot"
version = "0.1.0"
description = "Reference solution for W7D1: Tool Calling & Structured Outputs"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.110,<1",
    "pydantic>=2.9,<3",
    "python-dotenv>=1.0,<2",
]

[dependency-groups]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
