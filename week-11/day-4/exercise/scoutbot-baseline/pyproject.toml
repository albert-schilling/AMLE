[project]
name = "scoutbot"
version = "0.22.0"
description = "Reference solution for W11D3 (Eval-Driven Development & LLM-as-Judge): evals.py adds an eval harness - a labelled EVAL_SET, deterministic BaseMetric checks (RoutedCorrectlyMetric, CitesSourcesMetric) that touch no model, and run_suite() over deepeval LLMTestCases; judge.py adds the LLM-as-judge as a swappable model behind deepeval's GEval (AnthropicJudge wrapping the same _client seam, StubJudge for offline runs), so an eval leads with the free deterministic checks and only escalates to the metered judge for open-ended answer quality. One new dependency for the week (deepeval, Wed only), and it runs fully offline once the phone-home env opt-outs are set before import"
requires-python = ">=3.10"
dependencies = [
    # New for W11D3, and the ONLY new dependency of Week 11: deepeval, the eval framework. We use four
    # things from it: LLMTestCase (a case: input, actual_output, retrieval_context, metadata), BaseMetric
    # (subclassed for deterministic, model-free checks), GEval (an LLM-as-judge metric), and evaluate()
    # (the batch runner). Two facts make it usable here: it runs FULLY offline once three phone-home env
    # vars are set before import (see judge.py), and its judge is a swappable DeepEvalBaseLLM - so we wrap
    # our own Anthropic client for real runs and a canned StubJudge for tests, the same seam as core._client.
    # Pinned <5 on the 4.x line spiked against; it pulls pydantic-settings and (harmlessly) an older click.
    "deepeval>=4.1,<5",
    # New for W10D4: Pydantic AI, the type-safe agent framework. `Agent(output_type=TicketTriage)` makes
    # the framework derive the tool/output schema from the Pydantic model, validate the model's reply
    # against it, and retry on a validation miss - the machinery Week 7's core.triage wrote by hand. The
    # agent is built with NO bound model so `import` needs no API key (binding a provider string eagerly
    # requires ANTHROPIC_API_KEY at construction); the real `AnthropicModel` is passed at call time, and
    # tests pass `TestModel`/`FunctionModel` with `pydantic_ai.models.ALLOW_MODEL_REQUESTS = False`.
    "pydantic-ai>=2.27,<3",
    # New for W10D1: the official Model Context Protocol SDK. `mcp[cli]` gives both the `FastMCP`
    # server (type hints become the tool schema - see `order_status_server.py`) and the client used
    # by `mcp_client.py` to discover and call a server's tools. Pinned `<2` on purpose: the v2 line is
    # a pre-release alpha that renames `FastMCP` to `MCPServer`; v1.x is the stable, production line.
    # Tests never spawn a server - the in-memory transport (`create_connected_server_and_client_session`)
    # wires a FastMCP instance straight to a client, the MCP analogue of patching the Anthropic client.
    "mcp[cli]>=1.29,<2",
    # New for W9D1, and the first dependency since W8D5's tracing SDK. `fastembed` is the embedding
    # model runner, chosen because it runs on ONNX Runtime and therefore pulls no PyTorch and no
    # TensorFlow - the single biggest cross-platform install headache avoided. `numpy` comes along as
    # a fastembed dependency and is what the cosine search is written in. The vector "store" is an
    # ordinary SQLite BLOB column, so nothing here is a vector database: at this corpus size a
    # brute-force dot product against every stored vector is instant and keeps retrieval transparent.
    # The model (~130MB) is fetched once on first use and cached; retrieval after that is offline.
    "fastembed>=0.8,<0.9",
    "numpy>=1.26,<3",
    # Nothing new for W8D3. `interrupt` and the stream writer both ship inside langgraph, so the
    # day that adds pausing and streaming adds no dependency at all - worth knowing when a student
    # goes looking for the package that does it.
    "anthropic>=0.110,<1",
    # LangGraph as the orchestration layer, from W8D1. No langchain-anthropic - every model call
    # still goes through the Anthropic SDK directly. That is also why token streaming goes through
    # `stream_mode="custom"` and a writer rather than `stream_mode="messages"`: there is no
    # LangChain chat model in the stack for the latter to hook into.
    "langgraph>=1.2,<2",
    # From W8D2: the file-backed checkpointer. `InMemorySaver` ships inside langgraph itself, but
    # it cannot outlive the process it is meant to protect against losing. As of W8D3 a
    # checkpointer is no longer optional at all, since `interrupt()` needs somewhere to record a
    # pause.
    "langgraph-checkpoint-sqlite>=3.1,<4",
    # New for W8D5, and the first dependency added since Tuesday's SQLite saver. The tracing SDK,
    # and only the SDK: no `opentelemetry-exporter-otlp`, because the day exports to the console and
    # a local JSONL file and never to a backend. The API package (`opentelemetry-api`) comes along as
    # a dependency of the SDK. Adding an OTLP exporter later is where a hosted backend would enter,
    # and it is one more line here plus one more processor in `tracing.build_tracer`.
    "opentelemetry-sdk>=1.44,<2",
    "pydantic>=2.9,<3",
    "python-dotenv>=1.0,<2",
]

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
# deepeval 4.1.x still exposes LLMTestCaseParams (which we use per the course convention) and pulls a
# pydantic-settings that emits its own deprecations. Neither affects behaviour; silence them so the suite
# output stays about our tests, not third-party deprecation noise.
filterwarnings = [
    "ignore::DeprecationWarning:deepeval.*",
    "ignore::DeprecationWarning:pydantic_settings.*",
    "ignore:.*LLMTestCaseParams.*:DeprecationWarning",
    # pydantic-settings warns "Field '...' has an incomplete definition" at import; match the message
    # text (the category name IncompleteFieldDefinitionWarning is not in the message, so a category-name
    # regex never fired).
    "ignore:.*has an incomplete definition.*",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
